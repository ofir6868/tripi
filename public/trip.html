<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טיול · TRIPI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <section class="trip-hero">
    <div class="hero-bg" id="trip-cover"></div>
    <div class="hero-veil"></div>
    <div class="trip-hero-inner">
      <a class="crumb" href="/">‹ חזרה לכל הטיולים</a>
      <h1 id="trip-title">טוען את הטיול…</h1>
      <div class="trip-meta" id="trip-meta"></div>
    </div>
  </section>

  <div class="trip-layout" id="trip-layout" style="display:none">
    <main>
      <div class="trip-desc glass" id="trip-desc"></div>
      <div id="days-container"></div>
    </main>
    <aside class="trip-side">
      <div class="ticket glass">
        <div class="ticket-label">✈ TRIPI PASS ✈</div>
        <div class="code" id="ticket-code"></div>
        <div class="ticket-sub">משתפים את הקוד — וכולם רואים את המסלול</div>
        <hr class="divider">
        <button class="btn btn-amber" id="copy-code" style="width:100%;justify-content:center">📋 העתקת קוד</button>
        <button class="btn btn-ghost" id="copy-link" style="width:100%;justify-content:center;margin-top:8px">🔗 העתקת קישור</button>
        <div class="copy-feedback" id="copy-feedback"></div>
      </div>
      <div class="dest-switcher" id="dest-switcher" style="display:none"></div>
      <div class="side-card glass" id="weather-card" style="display:none">
        <div class="side-card-title">🌤️ מזג האוויר בשבוע הקרוב</div>
        <div class="weather-row" id="weather-row"></div>
      </div>
      <div class="map-card glass">
        <iframe id="trip-map" title="מפת היעד" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="map-caption" id="map-caption"></div>
      </div>
      <div class="side-card glass" id="hotels-card" style="display:none">
        <div class="side-card-title">🏨 מלונות באזור</div>
        <div id="hotels-list"></div>
        <div class="side-card-foot" id="hotels-foot"></div>
      </div>
    </aside>
  </div>

  <div class="page-shell" id="not-found" style="display:none">
    <div class="empty-state glass" style="border-radius:var(--radius)">
      <div class="big">🧳</div>
      <h2 style="font-family:var(--font-display);margin-bottom:8px">הטיול הזה לא נמצא</h2>
      <p>אולי הקוד שגוי? בדקו שוב או חזרו לעמוד הבית.</p>
      <a class="btn btn-amber" href="/" style="margin-top:18px">לעמוד הבית</a>
    </div>
  </div>

  <footer class="site-footer">
    <span class="logo-mark">TRIPI</span> · נבנה באהבה לטיולים · <span dir="ltr">© 2026</span>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/trip.js"></script>
</body>
</html>
