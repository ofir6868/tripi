<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הטיולים שלי · TRIP MAKER</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRIP MAKER">
  <meta name="theme-color" content="#0a1512">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="page-shell" style="width:min(1120px,calc(100% - 32px))">
    <h1>הטיולים <span style="color:var(--amber)">שלי</span> 🧳</h1>
    <p class="page-sub">המסלולים שיצרתם והטיולים שהצטרפתם אליהם, במקום אחד</p>
    <div id="my-wrap">
      <div class="my-grid" id="my-grid">
        <span class="skl skl-tripcard"></span><span class="skl skl-tripcard"></span><span class="skl skl-tripcard"></span>
      </div>
    </div>
    <div class="empty-state glass" id="empty" style="display:none;border-radius:var(--radius)">
      <div class="big">🗺️</div>
      <h2 style="font-family:var(--font-display);margin-bottom:8px">עוד אין כאן טיולים</h2>
      <p>הטיול הראשון שלכם במרחק שלושה צעדים קטנים.</p>
      <a class="btn btn-amber btn-lg" href="/plan" style="margin-top:18px">+ מתכננים טיול ראשון</a>
    </div>
  </div>

  <footer class="site-footer">
    <span class="logo-stack" dir="ltr" role="img" aria-label="TRIP MAKER"><span class="ls-trip" aria-hidden="true"><b>T</b><b>R</b><b>I</b><b>P</b></span><span class="ls-maker" aria-hidden="true"><b>M</b><b>A</b><b>K</b><b>E</b><b>R</b></span></span> · נבנה באהבה לטיולים · <span dir="ltr">© 2026</span>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/webmcp.js"></script>
  <script src="/js/webmcp-tools.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const wrap = document.getElementById('my-wrap');
      const grid = document.getElementById('my-grid');
      if (!TRIPI.user) { grid.innerHTML = ''; openAuthModal(() => location.reload()); return; }
      // a draft card shows a "בתכנון" tag where the (not yet revealed) code chip
      // would be; everything else — cover, delete, link — behaves the same
      const card = (t) => `
          <a class="trip-card" href="/trip/${t.share_code}">
            <div class="tc-media">
              <img class="tc-img" src="${TRIPI.esc(t.cover_image || '')}" alt="" loading="lazy" onerror="this.removeAttribute('src')">
              <span class="tc-emoji">${t.emoji || '🧭'}</span>
              <span class="tc-days">${t.days} ימים</span>
              ${t.is_draft ? '<span class="tc-role draft">✍️ בתכנון</span>' : (t.is_mine ? '' : '<span class="tc-role">משתתף</span>')}
              ${!t.is_mine ? '' : `<button class="tc-delete" data-id="${t.id}" title="מחיקת הטיול" aria-label="מחיקת הטיול">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path class="td-lid" d="M3.5 6h17M9.5 6V4.4A1.4 1.4 0 0 1 10.9 3h2.2a1.4 1.4 0 0 1 1.4 1.4V6"/>
                  <path d="M18.4 6l-.8 12.7A2 2 0 0 1 15.6 20.6H8.4a2 2 0 0 1-2-1.9L5.6 6"/>
                  <path d="M10.3 10.4v5.9M13.7 10.4v5.9"/>
                </svg>
              </button>`}
              ${t.is_draft ? '' : `<span class="tc-code-chip copyable" data-copy="${t.share_code}" title="לחיצה מעתיקה את קוד הטיול">#${t.share_code}</span>`}
              <div class="tc-body">
                <div class="tc-country">${TRIPI.esc(t.country || '')}</div>
                <div class="tc-title">${TRIPI.esc(t.title)}</div>
                <div class="tc-dest">${TRIPI.esc(t.destination)}</div>
              </div>
            </div>
          </a>`;
      try {
        const trips = await TRIPI.api('/api/my-trips');
        if (!trips.length) { grid.innerHTML = ''; document.getElementById('empty').style.display = ''; return; }
        const drafts = trips.filter((t) => t.is_draft);
        const rest = trips.filter((t) => !t.is_draft);
        if (drafts.length) {
          wrap.innerHTML = `
            <h2 class="my-sec">✍️ בתכנון</h2>
            <div class="my-grid">${drafts.map(card).join('')}</div>
            <h2 class="my-sec">🧳 הטיולים שלי</h2>
            ${rest.length
              ? `<div class="my-grid">${rest.map(card).join('')}</div>`
              : '<div class="my-sec-hint">כשמסיימים לתכנן טיוטה — הטיול עובר לכאן, עם קוד שיתוף</div>'}`;
        } else {
          grid.innerHTML = rest.map(card).join('');
        }
        wrap.querySelectorAll('.tc-delete').forEach((b) => {
          b.addEventListener('click', async (e) => {
            e.preventDefault(); e.stopPropagation();
            if (b.disabled) return;
            if (!confirm('למחוק את הטיול לצמיתות?')) return;
            b.disabled = true;
            try { await TRIPI.api('/api/trips/' + b.dataset.id, { method: 'DELETE' }); }
            catch { b.disabled = false; return; }
            location.reload();
          });
        });
      } catch (err) {
        grid.innerHTML = '<div class="empty-day">' + TRIPI.esc(err.message) + '</div>';
      }
    });
  </script>
</body>
</html>
