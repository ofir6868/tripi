<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול · TRIPI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a1512">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="page-shell" style="width:min(1120px,calc(100% - 32px))">
    <h1>מרכז <span style="color:var(--amber)">הניהול</span> ⚙️</h1>
    <p class="page-sub">כל המשתמשים והטיולים באתר — במקום אחד</p>

    <div class="adm-stats" id="adm-stats">
      <span class="skl skl-card short"></span><span class="skl skl-card short"></span>
      <span class="skl skl-card short"></span><span class="skl skl-card short"></span>
    </div>

    <div class="adm-bar">
      <div class="adm-tabs" role="tablist">
        <button class="adm-tab active" id="tab-trips" role="tab">🧭 טיולים</button>
        <button class="adm-tab" id="tab-users" role="tab">👥 משתמשים</button>
      </div>
      <input class="adm-search" id="adm-search" type="search" placeholder="חיפוש לפי שם, יעד, אימייל או קוד טיול…" autocomplete="off">
    </div>

    <div class="adm-panel glass" id="adm-panel">
      <span class="skl skl-row"></span><span class="skl skl-row"></span><span class="skl skl-row"></span>
    </div>
  </div>

  <footer class="site-footer">
    <span class="logo-mark">TRIPI</span> · אזור ניהול · <span dir="ltr">© 2026</span>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
