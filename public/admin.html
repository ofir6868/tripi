<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול · TRIP MAKER</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a1512">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="page-shell" style="width:min(1120px,calc(100% - 32px))">
    <h1>מרכז <span style="color:var(--amber)">הניהול</span> ⚙️</h1>
    <p class="page-sub">כל המשתמשים והטיולים באתר — במקום אחד</p>

    <div class="adm-stats" id="adm-stats">
      <div class="adm-stat glass">
        <div class="adm-stat-n"><span class="skl skl-stat-n"></span></div>
        <div class="adm-stat-label"><span class="skl skl-stat-label"></span></div>
        <div class="adm-stat-sub"><span class="skl skl-stat-sub"></span></div>
      </div>
      <div class="adm-stat glass">
        <div class="adm-stat-n"><span class="skl skl-stat-n"></span></div>
        <div class="adm-stat-label"><span class="skl skl-stat-label"></span></div>
        <div class="adm-stat-sub"><span class="skl skl-stat-sub"></span></div>
      </div>
      <div class="adm-stat glass">
        <div class="adm-stat-n"><span class="skl skl-stat-n"></span></div>
        <div class="adm-stat-label"><span class="skl skl-stat-label"></span></div>
        <div class="adm-stat-sub"><span class="skl skl-stat-sub"></span></div>
      </div>
      <div class="adm-stat glass">
        <div class="adm-stat-n"><span class="skl skl-stat-n"></span></div>
        <div class="adm-stat-label"><span class="skl skl-stat-label"></span></div>
        <div class="adm-stat-sub"><span class="skl skl-stat-sub"></span></div>
      </div>
    </div>

    <div class="adm-bar">
      <div class="adm-tabs" role="tablist">
        <button class="adm-tab active" id="tab-trips" role="tab">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2 5.2-5.2 2 2-5.2Z"/></svg>
          טיולים
        </button>
        <button class="adm-tab" id="tab-users" role="tab">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13A4 4 0 0 1 16 11"/></svg>
          משתמשים
        </button>
      </div>
      <input class="adm-search" id="adm-search" type="search" placeholder="חיפוש לפי שם, יעד, אימייל או קוד טיול…" autocomplete="off">
      <button class="btn btn-amber" id="adm-add-user" style="display:none">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        משתמש חדש
      </button>
    </div>

    <div class="adm-panel glass" id="adm-panel">
      <div class="skl-rows">
        <span class="skl"></span><span class="skl"></span><span class="skl"></span><span class="skl"></span>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <span class="logo-stack" dir="ltr" role="img" aria-label="TRIP MAKER"><span class="ls-trip" aria-hidden="true"><b>T</b><b>R</b><b>I</b><b>P</b></span><span class="ls-maker" aria-hidden="true"><b>M</b><b>A</b><b>K</b><b>E</b><b>R</b></span></span> · אזור ניהול · <span dir="ltr">© 2026</span>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
