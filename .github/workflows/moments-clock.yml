# The clock the moment pushes need (lib/reminders.js momentsTick, routes/cron.js).
#
# Vercel's free scheduler rings once a day, and a bus at 08:30 cannot wait for 06:00 UTC.
# This repository is public, so a scheduled workflow here costs nothing: every five minutes
# it rings /api/cron/moments with the same CRON_SECRET Vercel's own cron uses. The route is
# safe at any frequency — a moment is claimed before it is sent — so an overlapping or late
# run never double-pings. GitHub may delay a schedule by a few minutes under load, which is
# why every lead time is measured in tens of minutes, not in ones.
#
# No secret to copy: the run asks GitHub for an OIDC token (a JWT GitHub signs, naming this
# repository) and the server verifies it against GitHub's published keys (lib/github-oidc.js).
name: moments-clock
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: moments-clock
  cancel-in-progress: false
jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_URL: ${{ vars.CRON_URL || 'https://tripmaker.co.il/api/cron/moments' }}
      AUDIENCE: ${{ vars.CRON_OIDC_AUDIENCE || 'tripmaker-cron' }}
    steps:
      - name: ring the moments doorbell
        run: |
          set -eu
          token=$(curl -fsS --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "::error::no OIDC token from GitHub"; exit 1; }
          curl -fsS --max-time 60 -H "Authorization: Bearer $token" "$CRON_URL"
